  <text x="165" y="44" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#D6336C" letter-spacing="1">HUT</text>
  <circle cx="235" cy="40" r="3" fill="#C9A34E" />
  <text x="66" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#7A6B72" letter-spacing="4">BE YOUR OWN STYLE</text>
