      <stop offset="0%" stop-color="#D6336C" />
      <stop offset="100%" stop-color="#A61E4D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A34E" />
